<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      font-size: 2rem;
      padding: 1rem 2rem;
      line-height: 1.2;
    }
  </style>

  <body></body>
  <script>
    /* На екран виводиться меню:
        1. Веселий
        2. Сумний
        3. Обурений
        Користувач вводить номер пункту меню і на екрані з’являється відповідне зображення смайла. 
    */

    //1.Вводимо дані
    const userNumber = parseInt(
      prompt("1. Веселий \n2. Сумний \n3. Обурений  \nВведіть номер", "0")
    );
    let result = "";
    //2.Знаходимо і виводимо результат
    switch (userNumber) {
      case 1:
        result = ":)";
        break;

      case 2:
        result = ":|";
        break;

      case 3:
        result = ":(";
        break;

      default:
        result = "error";
        break;
    }
    document.write(`<h1>${result}</h1>`);
  </script>
</html>
