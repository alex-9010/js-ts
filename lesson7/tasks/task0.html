<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задача 0</title>
    <style>
      body {
        font-size: 2rem;
        padding: 1rem 2rem;
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <script>
      // Створити функцію, яка за номером місяця повертає пору року, до якої відноситься цей місяць.
      if (confirm("Почати тестування?")) {
        //1.Вводимо необхідні дані
        const monthNumber = parseInt(prompt(`Введіть номер місяця`, "1"));

        //2. Обчислюємо і виводимо результат
        function getSeason(month) {
          switch (month) {
            case 12:
            case 1:
            case 2:
              return "Зима";
            case 3:
            case 4:
            case 5:
              return "Весна";
            case 6:
            case 7:
            case 8:
              return "Літо";
            case 9:
            case 10:
            case 11:
              return "Осінь";
            default:
              return "Не правильно задане число!!!";
          }
        }
        let result = getSeason(monthNumber);
        document.write(result);
      }
    </script>
  </body>
</html>
