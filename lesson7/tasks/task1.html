<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задача 1</title>
    <style>
      body {
        font-size: 2rem;
        padding: 1rem 2rem;
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <script>
      // Створити функцію, яка за номером місяця повертає його назву.
      if (confirm("Почати тестування?")) {
        //1.Вводимо необхідні дані
        const monthNumber = parseInt(prompt(`Введіть номер місяця`, "1"));

        //2. Обчислюємо і виводимо результат
        function getMonthName(month) {
          switch (month) {
            case 1:
              return "Січень";
            case 2:
              return "Лютий";
            case 3:
              return "Березень";
            case 4:
              return "Квітень";
            case 5:
              return "Травень";
            case 6:
              return "Червень";
            case 7:
              return "Липень";
            case 8:
              return "Серпень";
            case 9:
              return "Вересень";
            case 10:
              return "Жовтень";
            case 11:
              return "Листопад";
            case 12:
              return "Грудень";
            default:
              return "Не правильно задане число!!!";
          }
        }
        let result = getMonthName(monthNumber);
        document.write(result);
      }
    </script>
  </body>
</html>
