<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Задача 6</title>
    <style>
      body {
        font-size: 2rem;
        padding: 1rem 2rem;
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <script>
      // Інвестор вклав S тис. грн на 20 років під 20% річних, податок складає 5% від суми прибутку. Визначити за допомогою циклів суму, яку він одержить.
      if (confirm("Почати тестування?")) {
        //1.Вводимо необхідні дані
        const maxYears = 20;
        const tax = 5;
        let capital = parseInt(prompt("Введіть скільки тис. грн вклав інвестор", "1")) * 1000;
        //2.Обчислюємо
        for (let numYear = 1; numYear <= maxYears; numYear++) {
          capital = capital + (capital * 20) / 100;
        }
        capital = capital - (capital * tax) / 100;

        //3.Виводимо результат
        document.write(`<h3>Інвестор отримає ${capital.toFixed(2)} грн через 20 років</h3>`);
      }
    </script>
  </body>
</html>
