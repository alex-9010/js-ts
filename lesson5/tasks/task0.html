<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <title>Задача 0</title>
    <style>
      body {
        font-size: 2rem;
        padding: 1rem 2rem;
        line-height: 1.2;
      }
      button {
        font-size: 1.5rem;
        margin: 0.25rem;
      }
    </style>
  </head>
  <body>
    <script>
      // Вивести на екран 8 кнопок з написом “Hello”.

      //1.Вводимо необхідні дані
      const amountButtons = 8;

      //2.Виводимо результат
      for (let i = 0; i < amountButtons; i++) {
        document.write(`<button>Hello</button>`);
      }
    </script>
  </body>
